repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks-docker

  - repo: local
    hooks:
      - id: generated-artwork
        name: generated artwork contract
        entry: uv run python tools/gen_icons.py --check
        language: system
        pass_filenames: false
        files: ^(artwork/|tools/gen_icons.py|src/mangame/assets/emblems/)

      - id: release-metadata
        name: release metadata agreement
        entry: uv run python tools/check_release.py
        language: system
        pass_filenames: false
        files: ^(src/mangame/__init__.py|CHANGELOG.md|tools/check_release.py)

      - id: third-party-notices
        name: third-party notice agreement
        entry: uv run python tools/gen_notices.py --check
        language: system
        pass_filenames: false
        files: ^(pyproject.toml|uv.lock|THIRD_PARTY_NOTICES.md|tools/gen_notices.py)

      - id: mypy
        name: mypy type check
        entry: uv run mypy src tests tools
        language: system
        types: [python]
        pass_filenames: false
