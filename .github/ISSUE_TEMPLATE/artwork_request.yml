name: Artwork idea
description: Propose a broadly useful generic emblem for the public wishlist.
labels: [artwork]
body:
  - type: textarea
    id: role
    attributes:
      label: What should this emblem communicate?
      description: >
        Describe the role it fills and why the M, book or generated badge does
        not already cover it.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Generic shape or concept
      description: >
        Keep it recognisable at 16 pixels. Do not propose character art,
        publisher marks or series logos.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source PNG
      description: >
        If you have a mock-up, attach the single colour PNG that should be used
        as the source. mangame generates the grey and silhouette states.
    validations:
      required: true

  - type: checkboxes
    id: rights
    attributes:
      label: Artwork rights
      options:
        - label: >
            Any mock-up I attach is my original work and may be contributed
            under the repository licence.
          required: true
