name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  metadata:
    name: release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python tools/check_release.py "${GITHUB_REF_NAME}"

  binaries:
    name: ${{ matrix.label }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            # Built on the oldest supported image so the glibc it links
            # against is old enough for the distributions people run.
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the Qt runtime libraries the Linux image does not ship
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - run: uv sync --locked --extra build --python 3.12

      - name: Freeze
        run: uv run pyinstaller packaging/mangame.spec --noconfirm

      - name: Prove the build starts
        # GUI builds have no stdout/stderr on Windows, so the smoke path must
        # report success through its exit status alone.
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MANGAME_HOME: ${{ runner.temp }}/mangame-home
        run: |
          case "${{ runner.os }}" in
            Windows) target="dist/mangame.exe" ;;
            macOS)   target="dist/mangame.app/Contents/MacOS/mangame" ;;
            *)       target="dist/mangame" ;;
          esac
          uv run python - "$target" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          target = sys.argv[1]
          log = Path(os.environ["MANGAME_HOME"]) / "mangame.log"
          try:
              result = subprocess.run([target, "--smoke-test"], timeout=30, check=False)
          except subprocess.TimeoutExpired:
              if log.exists():
                  print(log.read_text(encoding="utf-8"))
              raise
          if result.returncode and log.exists():
              print(log.read_text(encoding="utf-8"))
          raise SystemExit(result.returncode)
          PY

      - name: Wrap it up
        shell: bash
        run: |
          mkdir -p upload
          name="mangame-${{ matrix.label }}"
          case "${{ runner.os }}" in
            Windows)
              7z a "upload/$name.zip" \
                ./dist/mangame.exe ./LICENSE ./README.md ./THIRD_PARTY_NOTICES.md
              ;;
            macOS)
              # ditto, not zip: it is the only tool that preserves the bundle.
              mkdir -p "$name"
              cp -R dist/mangame.app "$name/"
              cp LICENSE README.md THIRD_PARTY_NOTICES.md "$name/"
              ditto -c -k --keepParent "$name" "upload/$name.zip"
              ;;
            *)
              mkdir -p "$name"
              cp dist/mangame LICENSE README.md THIRD_PARTY_NOTICES.md "$name/"
              cp packaging/mangame.desktop packaging/icons/mangame.png "$name/"
              tar -czf "upload/$name.tar.gz" "$name"
              ;;
          esac
          ls -lh upload

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mangame-${{ matrix.label }}
          path: upload/*

  distributions:
    name: wheel and sdist
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*

  release:
    name: publish the release
    needs: [binaries, distributions]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect files and write checksums
        run: |
          mkdir release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false

  pypi:
    name: publish to PyPI
    needs: [distributions]
    # Off until a PyPI trusted publisher exists for this repository. Set the
    # repository variable PUBLISH_TO_PYPI to "true" to turn it on; see
    # CONTRIBUTING.md for the one-time setup.
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
